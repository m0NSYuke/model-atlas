# Runs on pushes to main and on every pull request: install, type check and build, tests, graph check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests (interpreter, training, study, gestures)
        run: npm test
      - name: Graph check (ports, shapes, spacing)
        run: npm run check:graphs
